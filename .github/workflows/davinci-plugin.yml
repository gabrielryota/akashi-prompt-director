name: Build DaVinci plugin (macOS)

on:
  push:
    paths:
      - "davinci-am-music-fix/**"
      - ".github/workflows/davinci-plugin.yml"
  workflow_dispatch:

jobs:
  compile-check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev
      - name: Build VST3 (Linux, compile check)
        working-directory: davinci-am-music-fix
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        working-directory: davinci-am-music-fix
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 + AU
        working-directory: davinci-am-music-fix
        run: cmake --build build --config Release --parallel -- -quiet

      - name: Validate AU
        working-directory: davinci-am-music-fix
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AMMusicFix_artefacts/Release/AU/AM Music Fix.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx AmFx Akas

      - name: Package DMG
        working-directory: davinci-am-music-fix
        run: |
          STAGE="dmg/AM Music Fix"
          mkdir -p "$STAGE"
          cp -R "build/AMMusicFix_artefacts/Release/VST3/AM Music Fix.vst3" "$STAGE/"
          cp -R "build/AMMusicFix_artefacts/Release/AU/AM Music Fix.component" "$STAGE/"
          codesign --force --deep -s - "$STAGE/AM Music Fix.vst3"
          codesign --force --deep -s - "$STAGE/AM Music Fix.component"
          cp packaging/Instalar.command "$STAGE/"
          chmod +x "$STAGE/Instalar.command"
          cp README.md "$STAGE/LEIA-ME.md"
          hdiutil create -volname "AM Music Fix" -srcfolder "$STAGE" -ov -format UDZO AM-Music-Fix-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AM-Music-Fix-macOS-dmg
          path: davinci-am-music-fix/AM-Music-Fix-macOS.dmg
